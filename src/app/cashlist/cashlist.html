<div class="table-container">

  <table>

    <thead>
      <tr>
        <th *ngFor="let header of headers">
          {{ header }}
        </th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let item of dataList; let i = index">

        <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
        <td>{{ item.UserName }}</td>
        <td>{{ item.BranchName }}</td>
        <td>{{ item.TerminalName }}</td>
        <td>{{ item.CashoutAmount }}</td>
        <td>{{ item.RemainingBalance }}</td>
        <td>{{ item.RequestedDateTime }}</td>
        <td>{{ item.Status }}</td>

        <td>
          <button
            class="btn btn-sm btn-primary"
            (click)="detail(item)">
            Details
          </button>
        </td>

      </tr>

       <tr *ngIf="dataList.length === 0">
        <td [attr.colspan]="headers.length" class="no-data">
          No Data Available
        </td>
      </tr>

    </tbody>

  </table>

  <div class="bottom-bar">

    <div class="page-size">

      <span>Page Size:</span>

      <select
        [(ngModel)]="pageSize"
        (change)="onPageSizeChange()">

        <option
          *ngFor="let size of [5,10,25,50]"
          [value]="size">

          {{ size }}

        </option>

      </select>

    </div>

    <div class="pagination">

      <button
        (click)="changePage(currentPage - 1)"
        [disabled]="currentPage === 1">
        «
      </button>

      <ng-container *ngFor="let i of arrive()">

        <button
          *ngIf="i !== '...'"
          (click)="changePage(+i)"
          [class.active]="i === currentPage">

          {{ i }}

        </button>

        <span *ngIf="i === '...'">...</span>

      </ng-container>

      <button
        (click)="changePage(currentPage + 1)"
        [disabled]="currentPage === totalPages">
        »
      </button>

    </div>

  </div>

</div>
