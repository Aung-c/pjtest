<div class="filter">
  <input type="text" placeholder="NRC" [(ngModel)]="tempFilter.NRC">
  <input type="text" placeholder="PPANo." [(ngModel)] ="tempFilter.PPANo">
  <input type="text" placeholder="PensionType" [(ngModel)]="tempFilter.PensionType">
  <button (click)="search()">Search</button>
  <button (click)="delete()">Clear</button>
</div>

<div class="table-container">
  <table>

    <thead>
      <tr>
        <th>No.</th>
        <th>NRC</th>
        <th>Pensioner Name</th>
        <th>Pensioner PPA No.</th>
        <th>Pension Type</th>
        <th>Division</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let tn of dataList; let i = index">

        <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
        <td>{{ tn.NRC }}</td>
        <td>{{ tn.PensionerName }}</td>
        <td>{{ tn.PPANo }}</td>
        <td>{{ tn.PensionType }}</td>
        <td>{{ tn.Division }}</td>

      </tr>

      <tr *ngIf="dataList.length === 0">
        <td colspan="6">No Data Available</td>
      </tr>

    </tbody>

  </table>

  <div class="bottom-bar">

    <div class="page-size">
      <span>Page Size:</span>

      <select [(ngModel)]="pageSize" (change)="onPageSizeChange()">
        <option *ngFor="let size of [5,10,25,50]" [value]="size">
          {{ size }}
        </option>
      </select>

    </div>

    <div class="pagination">

      <button (click)="changePage(currentPage - 1)"
              [disabled]="currentPage === 1">
        «
      </button>

      <ng-container *ngFor="let i of arrive()">

        <button *ngIf="i !== '...'"
                (click)="changePage(i)"
                [class.active]="i === currentPage">
          {{ i }}
        </button>

        <span *ngIf="i === '...'">...</span>

      </ng-container>

      <button (click)="changePage(currentPage + 1)"
              [disabled]="currentPage === totalPages">
        »
      </button>

    </div>
    
</div>

  <button class="nominee-btn" (click)="nomi()">
    Nominee Page
  </button>

 

</div>
