<div class="create-container">

  <div class="create-header">
    <h2 class="create-title">Create</h2>
    <button class="back-btn" (click)="back()">← Back</button>
  </div>

  <div class="form-card">

    <div class="form-group">
      <label>Name <span class="required">*</span></label>
      <input type="text" [(ngModel)]="form.UserName" placeholder="Type here">
    </div>

    <div class="form-group">
      <label>Phone <span class="required">*</span></label>
      <input type="tel" [(ngModel)]="form.PhoneNumber" placeholder="Type here">
    </div>

    <div class="form-group">
      <label>Email <span class="required">*</span></label>
      <input type="email" [(ngModel)]="form.Email" placeholder="Type here">
    </div>

    <div class="form-group">
      <label>Date of Birth <span class="required"></span></label>
      <input type="date" [(ngModel)]="form.DateOfBirth">
    </div>

    <div class="form-group">
      <label>Role <span class="required">*</span></label>
      <select [(ngModel)]="form.RoleId">
        <option value="">-- Select Role --</option>
        @for (r of roles; track r.Value) {
          <option [value]="r.Value">{{ r.Label }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Branch <span class="required">*</span></label>
      <select [(ngModel)]="form.BranchId" (change)="onBranchChange()">
        <option value="">-- Select Branch --</option>
        @for (b of branches; track b.Value) {
          <option [value]="b.Value">{{ b.Label }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Terminal</label>
      <select [(ngModel)]="form.TerminalId">
        <option value="">---</option>
        @for (t of terminals; track t.Value) {
          <option [value]="t.Value">{{ t.Label }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Select Region</label>
      <select [(ngModel)]="form.RegionIds[0]">
        <option value="">Choose Regions...</option>
        @for (r of regions; track r.Value) {
          <option [value]="r.Value">{{ r.Label }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Status <span class="required">*</span></label>
      <div class="radio-group">
        <label class="radio-item">
          <input type="radio" name="status" value="Active" [(ngModel)]="form.Status">
          <span>Active</span>
        </label>
        <label class="radio-item">
          <input type="radio" name="status" value="Inactive" [(ngModel)]="form.Status">
          <span>Inactive</span>
        </label>
      </div>
    </div>

    <div class="button-group">
      <button class="cancel-btn" (click)="cancel()">Cancel</button>
      <button class="save-btn" (click)="save()">Save</button>
    </div>

  </div>

</div>
