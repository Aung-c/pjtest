<div class="table-container">

  <div class="top-bar">
    <h2>Agent Roles</h2>
  </div>

  <table>
    <thead>
      <tr>
        <th *ngFor="let header of headers">{{ header }}</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of roles; let i = index">
        <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>

        <td>{{ item.RoleName }}</td>

        <td>
  <span class="tag" *ngFor="let p of item.Permission">
    {{ p.PermissionValue || p.ClaimValue }}
  </span>
</td>
        <td>
          <button class="btn btn-primary" (click)="onDetail(item)">Detail</button>
        </td>
      </tr>

      <tr *ngIf="roles.length === 0">
        <td colspan="4" class="no-data">No Data Available</td>
      </tr>
    </tbody>
  </table>

  <div class="bottom-bar">
    <select [(ngModel)]="pageSize" (change)="onPageSizeChange()">
      <option *ngFor="let size of [5,10,25,50]" [value]="size">{{ size }}</option>
    </select>

    <div class="pagination">
      <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">«</button>

      <ng-container *ngFor="let i of arrive()">
        <button *ngIf="i !== '...'" (click)="changePage(+i)" [class.active]="i === currentPage">
          {{ i }}
        </button>
        <span *ngIf="i === '...'">...</span>
      </ng-container>

      <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">»</button>
    </div>
  </div>

</div> -->
